<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>資産管理アプリ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>資産管理アプリ</h1>

      <section class="card">
        <h2>資産を追加</h2>
        <form id="asset-form" class="form-grid">
          <label>
            資産名
            <input id="name" type="text" required placeholder="例: 普通預金" />
          </label>
          <label>
            カテゴリ
            <select id="category" required>
              <option value="現金">現金</option>
              <option value="預金">預金</option>
              <option value="株式">株式</option>
              <option value="投資信託">投資信託</option>
              <option value="暗号資産">暗号資産</option>
              <option value="その他">その他</option>
            </select>
          </label>
          <label>
            金額（円）
            <input id="amount" type="number" min="0" step="1" required placeholder="100000" />
          </label>
          <label>
            メモ
            <input id="memo" type="text" placeholder="任意" />
          </label>
          <button type="submit">追加</button>
        </form>
      </section>

      <section class="card summary">
        <h2>サマリー</h2>
        <p>総資産: <strong id="total">¥0</strong></p>
        <div id="category-summary"></div>
      </section>

      <section class="card">
        <div class="asset-header">
          <h2>資産一覧</h2>
          <button id="clear-all" class="danger">全削除</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>資産名</th>
              <th>カテゴリ</th>
              <th>金額</th>
              <th>メモ</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="asset-table-body"></tbody>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
